<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Зворотний зв'язок — АвтоПомічник</title>

    <meta
        name="description"
        content="АвтоПомічник — зберігайте історію обслуговування, ремонти, витрати, заправки та нагадування вашого автомобіля."
    >

    <link rel="stylesheet" href="style.css">
</head>

<body class="feedback-page">

    <main class="feedback-main">

        <section class="feedback-hero">

            <p class="garage-label">
                ЗВОРОТНИЙ ЗВ'ЯЗОК
            </p>

            <h1>
                Напишіть нам
            </h1>

            <p>
                Якщо у вас є питання, пропозиція
                або ви помітили проблему в роботі
                АвтоПомічника — залиште повідомлення.
            </p>

        </section>


        <section class="feedback-form-section">

            <form
                class="feedback-form"
                id="feedback-form"
            >

                <div class="feedback-field">

                    <label for="feedback-name">
                        Ваше ім'я
                    </label>

                    <input
                        type="text"
                        id="feedback-name"
                        placeholder="Наприклад: Олександр"
                        required
                    >

                </div>


                <div class="feedback-field">

                    <label for="feedback-email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="feedback-email"
                        placeholder="example@email.com"
                        required
                    >

                </div>


                <div class="feedback-field">

                    <label for="feedback-subject">
                        Тема
                    </label>

                    <input
                        type="text"
                        id="feedback-subject"
                        placeholder="Коротко опишіть питання"
                        required
                    >

                </div>


                <div class="feedback-field">

                    <label for="feedback-message">
                        Повідомлення
                    </label>

                    <textarea
                        id="feedback-message"
                        rows="7"
                        placeholder="Напишіть ваше повідомлення..."
                        required
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="feedback-submit-button"
                >
                    Надіслати повідомлення
                </button>

            </form>

        </section>

    </main>

     <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
    <script src="menu.js"></script>

</body>

</html>
