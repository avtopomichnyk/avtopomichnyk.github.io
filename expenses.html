<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Інші витрати — АвтоПомічник
    </title>
    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body class="car-page expenses-page">

    <header class="garage-header">

        <div class="container garage-header-container">

            <a
                href="garage.html"
                class="logo"
            >
                🚗 АвтоПомічник
            </a>


            <div class="garage-user-menu">

                <span id="user-name">
                    Користувач
                </span>

                <button
                    type="button"
                    class="logout-button"
                    id="logout-button"
                >
                    Вийти
                </button>

            </div>

        </div>

    </header>


    <main class="car-main">

        <div class="container">

            <a
                href="garage.html"
                class="back-to-garage"
            >
                ← Назад до гаража
            </a>


            <!-- ДАНІ АВТОМОБІЛЯ -->

            <section
                class="car-details"
                id="car-details"
            >

                <p>
                    Завантаження автомобіля...
                </p>

            </section>


            <!-- ВИТРАТИ -->

            <section
                class="expenses-section"
                id="expenses-section"
            >

                <div class="maintenance-heading">

                    <div>

                        <p class="garage-label">
                            ІНШІ ВИТРАТИ
                        </p>

                        <h2>
    💰 Інші витрати
</h2>

                    </div>


                    <button
                        type="button"
                        class="add-maintenance-button"
                        id="add-expense-button"
                    >
                        + Додати витрату
                    </button>

                </div>


                <div
                    class="maintenance-list"
                    id="expenses-list"
                >

                    <div class="maintenance-empty">

                        <p>
                            Інших витрат поки немає.
                        </p>

                    </div>

                </div>

                <!-- ФОРМА ДОДАВАННЯ ВИТРАТИ -->

<div
    class="expense-form-container"
    id="expense-form-container"
    hidden
>

    <form
        class="expense-form"
        id="expense-form"
    >

        <h2 id="expense-form-title">
            Нова витрата
        </h2>


        <div class="expense-form-grid">


            <div class="expense-field">

                <label for="expense-title">
                    Назва витрати *
                </label>

                <input
                    type="text"
                    id="expense-title"
                    placeholder="Наприклад: Страхування"
                    required
                >

            </div>


            <div class="expense-field">

                <label for="expense-date">
                    Дата *
                </label>

                <input
                    type="date"
                    id="expense-date"
                    required
                >

            </div>


            <div class="expense-field">

                <label for="expense-amount">
                    Сума, грн *
                </label>

                <input
                    type="number"
                    id="expense-amount"
                    min="0"
                    step="0.01"
                    placeholder="Наприклад: 2500"
                    required
                >

            </div>


            <div class="expense-field">

                <label for="expense-category">
                    Категорія
                </label>

                <select id="expense-category">

                    <option value="">
                        Не вказано
                    </option>

                    <option value="insurance">
                        Страхування
                    </option>

                    <option value="parking">
                        Паркування
                    </option>

                    <option value="wash">
                        Мийка
                    </option>

                    <option value="parts">
                        Запчастини
                    </option>

                    <option value="accessories">
                        Аксесуари
                    </option>

                    <option value="fine">
                        Штраф
                    </option>

                    <option value="other">
                        Інше
                    </option>

                </select>

            </div>


            <div class="expense-field">

                <label for="expense-mileage">
                    Пробіг
                </label>

                <input
                    type="number"
                    id="expense-mileage"
                    min="0"
                    placeholder="Наприклад: 257600"
                >

            </div>


            <div class="expense-field">

                <label for="expense-place">
                    Місце
                </label>

                <input
                    type="text"
                    id="expense-place"
                    placeholder="Наприклад: СТО, магазин або сервіс"
                >

            </div>


            <div class="expense-field expense-field-full">

                <label for="expense-description">
                    Опис
                </label>

                <textarea
                    id="expense-description"
                    rows="5"
                    placeholder="Додаткова інформація про витрату..."
                ></textarea>

            </div>


        </div>


        <div class="expense-form-actions">

            <button
                type="button"
                class="expense-cancel-button"
                id="cancel-expense-button"
            >
                Скасувати
            </button>


            <button
                type="submit"
                class="expense-save-button"
                id="save-expense-button"
            >
                Зберегти витрату
            </button>

        </div>

    </form>

</div>

            </section>

        </div>

    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="script.js"></script>

    <script src="menu.js"></script>

</body>

</html>
