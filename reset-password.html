<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Новий пароль — АвтоПомічник
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body class="auth-page">

    <header class="auth-header">

        <div class="container">

            <a
                href="index.html"
                class="logo"
            >
                🚗 АвтоПомічник
            </a>

        </div>

    </header>


    <main class="auth-main">

        <div class="auth-container">

            <div class="auth-card">

                <div class="auth-title">

                    <div class="auth-icon">
                        🔐
                    </div>

                    <h1>
                        Створіть новий пароль
                    </h1>

                    <p>
                        Введіть новий пароль
                        для вашого акаунта.
                    </p>

                </div>


                <form
                    class="auth-form"
                    id="reset-password-form"
                >

<div class="form-group">

    <label for="reset-password">
        Новий пароль
    </label>

    <input
        type="password"
        id="reset-password"
        minlength="8"
        placeholder="Мінімум 8 символів"
        required
    >

</div>


<div class="form-group">

    <label for="reset-password-confirm">
        Повторіть пароль
    </label>

    <input
        type="password"
        id="reset-password-confirm"
        minlength="8"
        placeholder="Повторіть новий пароль"
        required
    >

</div>

                    <button
                        type="submit"
                        class="auth-submit"
                    >
                        Зберегти новий пароль
                    </button>

                </form>


                <p class="auth-switch">

                    <a href="login.html">
                        ← Повернутися до входу
                    </a>

                </p>

            </div>

        </div>

    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="script.js"></script>

    <script src="menu.js"></script>

</body>

</html>
